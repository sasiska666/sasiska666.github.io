# Rebuilds the site whenever something in source/ changes and commits the
# result to the repository root, which GitHub Pages serves as-is.
name: Build site

on:
  push:
    branches: [main]
    paths: ['source/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: source
        run: |
          npm install
          npx vite build
      - name: Copy build to repository root
        run: |
          rm -rf assets index.html favicon.svg apple-touch-icon.png og-image.png logo-512.png
          cp -r source/dist/. .
          touch .nojekyll
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!source'
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Rebuild site from source/"
          git push
